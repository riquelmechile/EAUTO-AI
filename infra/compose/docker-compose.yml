services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eauto
      POSTGRES_USER: eauto
      POSTGRES_PASSWORD: eauto
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eauto -d eauto"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: eauto
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: ["minio_data:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 eauto change-me-now; do sleep 2; done;
        mc mb --ignore-existing local/eauto-content;
        mc anonymous set none local/eauto-content

  api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm ci && npm run build:server && npm run migrate && npm run start -w @eauto/api"
    environment: &runtime-environment
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://eauto:eauto@postgres:5432/eauto
      AUTH_MODE: disabled
      OPERATOR_TOKENS_JSON: "[]"
      OBJECT_STORAGE_BUCKET: eauto-content
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://10.0.2.2:9000}
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: eauto
      OBJECT_STORAGE_SECRET_KEY: change-me-now
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OUTBOX_WORKER_ID: compose-outbox
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ../../:/workspace
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  outbox-worker:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm ci && npm run build:server && npm run migrate && npm run start:worker -w @eauto/api"
    environment: *runtime-environment
    volumes:
      - ../../:/workspace
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  minio_data:
