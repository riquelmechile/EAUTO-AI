services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eauto
      POSTGRES_USER: eauto
      POSTGRES_PASSWORD: eauto
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eauto -d eauto"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: eauto
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: ["minio_data:/data"]

  api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm install && npm run build && npm run start -w @eauto/api"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://eauto:eauto@postgres:5432/eauto
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ../../:/workspace
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  minio_data:
