name: Apply CORS type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/systematic-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/systematic-production-audit
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Patch exact optional CORS options
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/app.ts')
          text = path.read_text()
          old = '''  const corsOrigins = config.CORS_ORIGIN.split(",").map((origin) => origin.trim());
          await app.register(cors, {
            origin:
              corsOrigins.length === 1 ? (corsOrigins[0] === "*" ? true : corsOrigins[0]) : corsOrigins,
          });
          '''
          new = '''  const corsOrigins = config.CORS_ORIGIN.split(",").map((origin) => origin.trim());
          const corsOrigin =
            corsOrigins.length === 1 ? (corsOrigins[0] === "*" ? true : corsOrigins[0]) : corsOrigins;
          await app.register(cors, corsOrigin === undefined ? {} : { origin: corsOrigin });
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one CORS block to replace.')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/diagnose-typecheck.yml
          rm -f .github/workflows/apply-cors-fix.yml
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit CORS correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: construct exact CORS options'
          git push origin HEAD:fix/systematic-production-audit
