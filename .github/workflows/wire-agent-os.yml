name: Wire Agent OS routes

on:
  push:
    branches: [feat/agent-os-company-organization]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-os-company-organization
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Register Agent OS routes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/app.ts')
          text = path.read_text()
          import_marker = 'import { registerMercadoLibreRoutes } from "./mercadoLibreRoutes.js";'
          if 'registerAgentOsRoutes' not in text:
              text = text.replace(import_marker, import_marker + '\nimport { registerAgentOsRoutes } from "./agentOsRoutes.js";')
          route_marker = '  app.get("/v1/me", async (request) => {'
          registration = '''  registerAgentOsRoutes(app, {
            runtime,
            authenticate: (request) => authenticate(request, runtime, authenticator),
            requireAccount: async (actor, accountId, permission) => {
              await requireAccount(runtime, actor, accountId, permission);
            },
          });

'''
          if registration not in text:
              if route_marker not in text:
                  raise SystemExit('Agent OS route insertion marker not found')
              text = text.replace(route_marker, registration + route_marker)
          path.write_text(text)
          PY
      - run: npm run format
      - run: rm .github/workflows/wire-agent-os.yml
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: wire Agent OS API routes"
          git push origin HEAD:feat/agent-os-company-organization
