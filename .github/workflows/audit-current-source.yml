name: Audit current source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package current source
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/eauto-current-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: eauto-current-source
          path: /tmp/eauto-current-source.tar.gz
          retention-days: 1
