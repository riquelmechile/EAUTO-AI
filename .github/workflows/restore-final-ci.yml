name: Restore final CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Restore read-only CI and remove this workflow
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.16.0
                    cache: npm
                - name: Install dependencies
                  run: npm ci --no-audit --no-fund
                - name: Check formatting
                  run: npm run format:check
                - name: Typecheck
                  run: npm run typecheck
                - name: Lint
                  run: npm run lint
                - name: Test
                  run: npm test
                - name: Build
                  run: npm run build
                - name: Start MinIO
                  run: |
                    docker compose -f infra/compose/docker-compose.yml up -d minio
                    docker compose -f infra/compose/docker-compose.yml run --rm minio-init
                - name: Object storage smoke
                  run: npm run smoke:object-storage
                - name: Doctor
                  run: npm run doctor
          YAML
          rm .github/workflows/restore-final-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/restore-final-ci.yml
          if git diff --cached --quiet; then
            echo "Final CI already restored."
            exit 0
          fi
          git commit -m "ci: restore final read-only quality pipeline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
