name: Apply scoped persistence audit fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/systematic-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Apply audited code patch
        shell: bash
        run: |
          cat .audit-patch/*.txt > /tmp/audit-patch.b64
          base64 --decode /tmp/audit-patch.b64 > /tmp/audit-patch.tar.gz
          tar -xzf /tmp/audit-patch.tar.gz -C .
          git checkout HEAD -- .github/workflows/ci.yml
      - name: Install and format
        run: |
          npm ci --no-audit --no-fund
          npm run format
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair scoped agent persistence and migrations"
          git push
