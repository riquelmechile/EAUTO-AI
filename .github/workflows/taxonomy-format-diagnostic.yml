name: Taxonomy format diagnostic

on:
  push:
    branches:
      - feat/mercadolibre-taxonomy-http-adapter

permissions:
  contents: read

concurrency:
  group: taxonomy-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone branch
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: git clone --quiet --depth 1 --branch "$BRANCH" "https://github.com/$REPOSITORY.git" .
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: Show exact Prettier diff
        run: |
          npx prettier --write packages/infrastructure/src/mercadoLibreTaxonomyHttpReader.ts tests/mercadoLibreTaxonomyHttpReader.test.ts >/dev/null
          git diff --unified=3 -- packages/infrastructure/src/mercadoLibreTaxonomyHttpReader.ts tests/mercadoLibreTaxonomyHttpReader.test.ts
