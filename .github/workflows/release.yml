name: Production release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create the Git tag and GitHub Release for the package version
        required: true
        default: true
        type: boolean
      build_android:
        description: Build the signed Android App Bundle with EAS
        required: true
        default: false
        type: boolean
      submit_to_play:
        description: Submit the Android App Bundle to the configured Play track
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Resolve and validate release identity
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag"
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$expected_tag"
            if [[ "${{ inputs.publish_release }}" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Publishing a GitHub Release is only allowed from main"
              exit 1
            fi
            if [[ "${{ inputs.submit_to_play }}" == "true" && "${{ inputs.build_android }}" != "true" ]]; then
              echo "submit_to_play requires build_android"
              exit 1
            fi
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release identity: $release_tag @ $GITHUB_SHA"
      - name: Verify lockfile is reproducible
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce dependency audit policy
        run: npm run audit:ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Measure test coverage
        run: npm run test:coverage
      - name: Build application
        run: npm run build
      - name: Verify MercadoLibre question answer contract
        run: npm run smoke:mercadolibre-question-answer
      - name: Verify credential generation and validation
        run: npm run smoke:credentials
      - name: Verify truthful capability parity claims
        run: npm run doctor:parity -- --require-no-partial
      - name: Verify Gentleman capability parity
        run: npm run doctor:gentleman-parity
      - name: Validate production and release contracts
        run: |
          cp .env.production.example .env.production
          npm run doctor:production -- --template --env=.env.production
          docker compose --env-file .env.production -f infra/compose/docker-compose.production.yml config --quiet
      - name: Build production API image
        run: docker build --pull --tag eauto-ai:release-candidate .

  container:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/riquelmechile/eauto-ai
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.quality.outputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        run: |
          echo "### Runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/riquelmechile/eauto-ai@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
      SUBMIT_TO_PLAY: ${{ inputs.submit_to_play == true }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.2.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Validate Android release credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is pending"; exit 1; }
          test -n "$EAS_PROJECT_ID" || { echo "EAS_PROJECT_ID is pending"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "EXPO_PUBLIC_API_URL is pending"; exit 1; }
          case "$EXPO_PUBLIC_API_URL" in https://*) ;; *) echo "EXPO_PUBLIC_API_URL must use HTTPS"; exit 1;; esac
          if [[ "$SUBMIT_TO_PLAY" == "true" ]]; then
            test -n "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" || { echo "GOOGLE_SERVICE_ACCOUNT_KEY_JSON is pending"; exit 1; }
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY_JSON" > apps/mobile/google-service-account.json
          fi
      - name: Build signed Android App Bundle
        id: android_build
        working-directory: apps/mobile
        run: |
          build_json="$RUNNER_TEMP/eas-build.json"
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > "$build_json"
          build_id="$(node - "$build_json" <<'NODE'
          const fs = require("node:fs");
          const input = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = Array.isArray(input) ? input[0] : input;
          if (!build || typeof build.id !== "string" || build.id.length === 0) {
            throw new Error("EAS build completed without a build ID.");
          }
          process.stdout.write(build.id);
          NODE
          )"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "build_url=https://expo.dev/projects/$EAS_PROJECT_ID/builds/$build_id" >> "$GITHUB_OUTPUT"
          echo "### Android App Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: https://expo.dev/projects/$EAS_PROJECT_ID/builds/$build_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Submit the exact build to Google Play Internal
        if: env.SUBMIT_TO_PLAY == 'true'
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform android \
            --profile production \
            --id "${{ steps.android_build.outputs.build_id }}" \
            --non-interactive \
            --wait
      - if: always()
        run: rm -f apps/mobile/google-service-account.json

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: [quality, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Ensure the release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it"
            exit 1
          fi
      - name: Prepare Spanish release notes
        env:
          RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## EAUTO-AI $RELEASE_TAG

          Primer release técnico reproducible de EAUTO-AI.

          ### Incluye

          - documentación principal reorganizada íntegramente en español;
          - nuevo diagrama SVG accesible del ciclo de control agéntico;
          - CI y release endurecidos con lockfile reproducible, auditoría de dependencias, tests, cobertura, build y doctors;
          - imagen multi-arquitectura en GHCR con SBOM, provenance y digest inmutable;
          - actualización de dependencias con todos los parches no-breaking disponibles;
          - excepción temporal, exacta y fail-closed para las dos advisories de image-size sin versión parcheada upstream.

          ### Evidencia

          - Commit: \`$GITHUB_SHA\`
          - Imagen: \`ghcr.io/riquelmechile/eauto-ai@$IMAGE_DIGEST\`

          ### Alcance

          Esta release certifica el software y sus artefactos reproducibles. **No declara producción comercial live**: DNS/TLS real, credenciales, OAuth/webhooks/Product Ads de MercadoLibre, AAB físico, restore drill y ventanas de reconciliación siguen controlados por el issue #41.
          EOF
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" \
            --silent
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "EAUTO-AI $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
