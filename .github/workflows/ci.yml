name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Update lockfile and install
        run: npm install --no-audit --no-fund
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile/package.json apps/mobile/app.json apps/mobile/App.tsx apps/mobile/src apps/api/src tests docs .github/workflows/ci.yml
          git commit -m "build: lock Android OAuth browser support"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Doctor
        run: npm run doctor
