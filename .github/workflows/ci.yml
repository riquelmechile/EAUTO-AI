name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: feat/catalog-acquisition-photo-similar
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            docs/sdd/005-catalog-acquisition-photo-similar.md \
            packages/domain/src/catalogAcquisition.ts \
            packages/domain/src/index.ts \
            packages/application/src/catalogAcquisitionService.ts \
            packages/application/src/index.ts \
            tests/catalogAcquisitionService.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              docs/sdd/005-catalog-acquisition-photo-similar.md \
              packages/domain/src/catalogAcquisition.ts \
              packages/domain/src/index.ts \
              packages/application/src/catalogAcquisitionService.ts \
              packages/application/src/index.ts \
              tests/catalogAcquisitionService.test.ts
            git commit -m "style: apply canonical catalog acquisition formatting"
            git push origin HEAD:feat/catalog-acquisition-photo-similar
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Prepare production template
        run: cp .env.production.example .env.production
      - name: Validate production and release contracts
        run: npm run doctor:production -- --template --env=.env.production
      - name: Verify production runtime and PostgreSQL
        run: npm run smoke:production-runtime
      - name: Validate production Compose
        run: docker compose --env-file .env.production -f infra/compose/docker-compose.production.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e API_DOMAIN=api.example.cl \
            -e S3_DOMAIN=files.example.cl \
            -e ACME_EMAIL=operations@example.cl \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production API image
        run: docker build --pull --target runtime --tag eauto-ai:ci .
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
