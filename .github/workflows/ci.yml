name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-postgres-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone PR branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install and build quietly
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build > /tmp/build.log 2>&1 || { tail -n 30 /tmp/build.log; exit 1; }
      - name: Run catalog PostgreSQL smoke directly
        run: |
          compose=(docker compose -p eauto-catalog-diagnostic -f infra/compose/docker-compose.yml)
          database_url=postgres://eauto:eauto@127.0.0.1:5432/eauto
          "${compose[@]}" up -d postgres > /tmp/postgres-start.log 2>&1
          cleanup() { "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if "${compose[@]}" exec -T postgres psql -U eauto -d eauto -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 30 /tmp/postgres-start.log
            exit 1
          fi
          DATABASE_URL="$database_url" node scripts/migrate.mjs > /tmp/migrate.log 2>&1 || { tail -n 30 /tmp/migrate.log; exit 1; }
          set +e
          DATABASE_URL="$database_url" node scripts/smoke-catalog-acquisition-postgres.mjs > /tmp/catalog-smoke.log 2>&1
          status=$?
          tail -n 40 /tmp/catalog-smoke.log
          exit "$status"
