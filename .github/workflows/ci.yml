name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-product-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format Product Ads files
        run: npx prettier --write scripts/smoke-mercadolibre-product-ads-postgres.mjs tests/mercadoLibreProductAdsHttpReader.test.ts tests/mercadoLibreProductAdsService.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-mercadolibre-product-ads-postgres.mjs tests/mercadoLibreProductAdsHttpReader.test.ts tests/mercadoLibreProductAdsService.test.ts
          git commit -m "chore: format Product Ads slice"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
