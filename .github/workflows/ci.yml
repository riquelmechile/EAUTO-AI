name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Install quietly
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: Show exact Android taxonomy Prettier diff
        run: |
          npx prettier --write \
            docs/sdd/016-android-mercadolibre-taxonomy-preflight.md \
            apps/mobile/src/lib/api.ts \
            apps/mobile/src/features/mercadolibre/MercadoLibreScreen.tsx \
            apps/mobile/src/features/mercadolibre/MercadoLibreTaxonomyPreflight.tsx \
            apps/mobile/src/features/mercadolibre/taxonomyPreflight.ts \
            tests/mobileMercadoLibreTaxonomyPreflight.test.ts >/dev/null
          git diff --unified=1
