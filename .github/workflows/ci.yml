name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format current Gentleman parity slice
        run: npx prettier --write packages/application/src/agentCollaborationService.ts packages/application/src/specialistDaemonScheduler.ts packages/application/src/supplyWorkflowService.ts packages/content/src/minimaxContentProvider.ts packages/domain/src/agentCollaboration.ts packages/domain/src/productLifecycle.ts packages/domain/src/supplyWorkflows.ts packages/infrastructure/src/companyIntelligenceSources.ts packages/infrastructure/src/inMemoryCompanyIntelligenceRepository.ts packages/infrastructure/src/postgresCompanyIntelligenceRepository.ts packages/infrastructure/src/postgresEconomicOperationsRepository.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src/agentCollaborationService.ts packages/application/src/specialistDaemonScheduler.ts packages/application/src/supplyWorkflowService.ts packages/content/src/minimaxContentProvider.ts packages/domain/src/agentCollaboration.ts packages/domain/src/productLifecycle.ts packages/domain/src/supplyWorkflows.ts packages/infrastructure/src/companyIntelligenceSources.ts packages/infrastructure/src/inMemoryCompanyIntelligenceRepository.ts packages/infrastructure/src/postgresCompanyIntelligenceRepository.ts packages/infrastructure/src/postgresEconomicOperationsRepository.ts
          git commit -m "chore: format Gentleman parity foundation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
