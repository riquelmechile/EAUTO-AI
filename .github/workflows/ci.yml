name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply strict type refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/application/src/governedWorkOrderProcessor.ts')
          text = path.read_text()
          text = text.replace(
              '...new Set(pack.documents.map((document) => document.kind)),',
              '...new Set(pack.documents.flatMap((document) => (document.kind ? [document.kind] : []))),',
          )
          text = text.replace(
              '  if (!selected && !fallback) throw new Error(`Agent ${contract.id} has no allowed capability.`);\n  return selected ?? fallback;',
              '  if (selected) return selected;\n  if (fallback) return fallback;\n  throw new Error(`Agent ${contract.id} has no allowed capability.`);',
          )
          path.write_text(text)
          PY
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit refinements
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: refine governed work order types"
          git push
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
