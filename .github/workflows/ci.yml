name: Patch Supplier Mirror Hash

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: patch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/supplier-mirror-stock-risk-daemon
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Replace discarded assessment field with explicit material
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/infrastructure/src/postgresSupplierMirrorRepository.ts")
          source = path.read_text()
          old = '''    const { evaluatedAt: _evaluatedAt, ...material } = assessment;
              const contentHash = hashCanonical(material);'''
          new = '''    const contentHash = hashCanonical({
                organizationId: assessment.organizationId,
                accountId: assessment.accountId,
                listingId: assessment.listingId,
                supplierSourceId: assessment.supplierSourceId,
                sourceType: assessment.sourceType,
                stockDelta: assessment.stockDelta,
                evidenceRefs: assessment.evidenceRefs,
                availabilityProposal: assessment.availabilityProposal,
                signals: assessment.signals,
              });'''
          if old not in source:
              raise SystemExit("assessment hash block not found")
          path.write_text(source.replace(old, new))
          PY
      - run: npm run format
      - name: Commit functional patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/infrastructure/src/postgresSupplierMirrorRepository.ts
          git commit -m "fix: use explicit supplier assessment hash material"
          git push origin HEAD:feat/supplier-mirror-stock-risk-daemon
