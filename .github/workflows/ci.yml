name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - name: Show exact Prettier diff
        run: |
          npx prettier --write docs/sdd/012-mercadolibre-taxonomy-preflight.md packages/domain/src/mercadoLibreTaxonomy.ts packages/application/src/mercadoLibreTaxonomyPreflightService.ts tests/mercadoLibreTaxonomyPreflight.test.ts packages/domain/src/index.ts packages/application/src/index.ts >/dev/null
          git diff --unified=3 -- docs/sdd/012-mercadolibre-taxonomy-preflight.md packages/domain/src/mercadoLibreTaxonomy.ts packages/application/src/mercadoLibreTaxonomyPreflightService.ts tests/mercadoLibreTaxonomyPreflight.test.ts packages/domain/src/index.ts packages/application/src/index.ts
