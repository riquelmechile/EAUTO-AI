name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone PR branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Install dependencies quietly
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: Show exact Prettier diff
        run: |
          npx prettier --write \
            packages/infrastructure/src/httpProductFingerprintProvider.ts \
            apps/api/src/config.ts \
            tests/httpProductFingerprintProvider.test.ts \
            tests/catalogAcquisitionConfig.test.ts >/dev/null
          git diff --unified=3 -- \
            packages/infrastructure/src/httpProductFingerprintProvider.ts \
            apps/api/src/config.ts \
            tests/httpProductFingerprintProvider.test.ts \
            tests/catalogAcquisitionConfig.test.ts
