name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply typed claimable statuses
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('packages/infrastructure/src/operationalIntelligenceRepositories.ts')
          text = path.read_text()
          pattern = r'\[\s*"queued"\s*,\s*"failed"\s*\]\.includes\(order\.status\)'
          replacement = '(["queued", "failed"] as readonly WorkOrderStatus[]).includes(order.status)'
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one claimable status match, found {count}')
          path.write_text(updated)
          PY
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: type claimable work order statuses"
          git push
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
