name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: audit/final-quality-gates
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Refresh lockfile once
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json
            git commit -m "chore: refresh dependency lockfile"
            git push origin HEAD:audit/final-quality-gates
            exit 0
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all dependency severities
        run: npm audit
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Verify MercadoLibre question answer contract
        run: npm run smoke:mercadolibre-question-answer
      - name: Verify credential generation and validation
        run: npm run smoke:credentials
      - name: Verify truthful capability parity claims
        run: npm run doctor:parity -- --require-no-partial
      - name: Verify Gentleman capability parity
        run: npm run doctor:gentleman-parity
      - name: Prepare production template
        run: cp .env.production.example .env.production
      - name: Validate production and release contracts
        run: npm run doctor:production -- --template --env=.env.production
      - name: Verify production runtime and PostgreSQL
        run: npm run smoke:production-runtime
      - name: Verify idempotency collision guards
        run: |
          compose=(docker compose -p eauto-idempotency-smoke -f infra/compose/docker-compose.yml)
          cleanup() { "${compose[@]}" down --volumes --remove-orphans; }
          trap cleanup EXIT
          "${compose[@]}" up -d postgres
          for attempt in $(seq 1 30); do
            if "${compose[@]}" exec -T postgres pg_isready -U eauto -d eauto; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not become ready"
              exit 1
            fi
            sleep 1
          done
          export DATABASE_URL=postgres://eauto:eauto@127.0.0.1:5432/eauto
          npm run migrate
          npm run smoke:idempotency-collisions
      - name: Validate production Compose
        run: docker compose --env-file .env.production -f infra/compose/docker-compose.production.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e API_DOMAIN=api.example.cl \
            -e S3_DOMAIN=files.example.cl \
            -e ACME_EMAIL=operations@example.cl \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production API image
        run: docker build --pull --target runtime --tag eauto-ai:ci .
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
