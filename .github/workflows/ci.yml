name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate reproducible formatting patch
        run: |
          npx prettier --write .
          git diff --binary > /tmp/prettier.patch
          cp package-lock.json /tmp/package-lock.json
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: ci-generated-${{ github.sha }}
          path: |
            /tmp/prettier.patch
            /tmp/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Doctor
        run: npm run doctor
