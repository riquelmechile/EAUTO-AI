name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          echo $? > test.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systematic-audit-tests
          path: test.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce tests
        shell: bash
        run: exit "$(cat test.status)"
      - name: Build application
        run: npm run build
      - name: Verify Postgres migrations and scoped repositories
        env:
          DATABASE_URL: postgres://eauto:eauto@127.0.0.1:5432/eauto
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d postgres
          until docker compose -f infra/compose/docker-compose.yml exec -T postgres pg_isready -U eauto -d eauto; do sleep 2; done
          npm run migrate
          npm run smoke:postgres-schema
          npm run migrate
      - name: Validate production configuration
        run: |
          cp .env.production.example .env.production
          npm run doctor:production -- --template --env=.env.production
          npm run smoke:production-runtime
          docker compose --env-file .env.production -f infra/compose/docker-compose.production.yml config --quiet
          docker run --rm \
            -e API_DOMAIN=api.example.cl \
            -e S3_DOMAIN=files.example.cl \
            -e ACME_EMAIL=operations@example.cl \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production API image
        run: docker build --pull --target runtime --tag eauto-ai:ci .
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop integration services
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --volumes --remove-orphans
      - name: Doctor
        run: npm run doctor
