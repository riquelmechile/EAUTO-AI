name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Install quietly
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: Show exact Prettier diff
        run: |
          npx prettier --write \
            docs/sdd/014-mercadolibre-taxonomy-snapshots-cache.md \
            package.json \
            packages/application/src/index.ts \
            packages/application/src/mercadoLibreTaxonomyCache.ts \
            packages/infrastructure/src/index.ts \
            packages/infrastructure/src/postgresMercadoLibreTaxonomySnapshotRepository.ts \
            scripts/smoke-mercadolibre-taxonomy-postgres.mjs \
            scripts/smoke-production-runtime.mjs \
            tests/mercadoLibreTaxonomyCache.test.ts >/dev/null
          git diff --unified=1
