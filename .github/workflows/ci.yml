name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Finalize runtime status fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/app.ts')
          text = path.read_text()
          old_ready = '''    externalWrites: false,
              contentGeneration: "development-simulator",'''
          new_ready = '''    externalWrites: runtime.actionExecutionMode === "external",
              actionExecution: runtime.actionExecutionMode,
              contentGeneration: runtime.contentGenerationMode,'''
          old_launch = '      externalGenerationPerformed: false,'
          new_launch = '      externalGenerationPerformed: runtime.contentGenerationMode === "external",'
          if text.count(old_ready) != 1:
              raise SystemExit(f'Expected one readiness block, found {text.count(old_ready)}')
          if text.count(old_launch) != 1:
              raise SystemExit(f'Expected one launch status, found {text.count(old_launch)}')
          text = text.replace(old_ready, new_ready, 1).replace(old_launch, new_launch, 1)
          path.write_text(text)
          PY
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit final adapter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: expose real production provider modes"
          git push
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Validate production configuration
        run: |
          cp .env.production.example .env.production
          npm run doctor:production -- --template --env=.env.production
          npm run smoke:production-runtime
          docker compose --env-file .env.production -f infra/compose/docker-compose.production.yml config --quiet
          docker run --rm \
            -e API_DOMAIN=api.example.cl \
            -e S3_DOMAIN=files.example.cl \
            -e ACME_EMAIL=operations@example.cl \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production API image
        run: docker build --pull --target runtime --tag eauto-ai:ci .
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
