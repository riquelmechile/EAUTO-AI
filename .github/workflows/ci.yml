name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Install quietly
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: List remaining files
        run: npx prettier --check docs/sdd/012-mercadolibre-taxonomy-preflight.md packages/domain/src/mercadoLibreTaxonomy.ts packages/application/src/mercadoLibreTaxonomyPreflightService.ts tests/mercadoLibreTaxonomyPreflight.test.ts packages/domain/src/index.ts packages/application/src/index.ts
