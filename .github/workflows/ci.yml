name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-fix-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact strict fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          scheduler = Path('packages/application/src/specialistDaemonScheduler.ts')
          text = scheduler.read_text()
          text = text.replace('signals: Object.freeze([]) as readonly Signal[],', 'signals: Object.freeze([]),')
          scheduler.write_text(text)
          source = Path('packages/infrastructure/src/companyIntelligenceSources.ts')
          text = source.read_text().replace('  MercadoLibreOrderSnapshot,\n', '')
          source.write_text(text)
          PY
          npx prettier --write packages/application/src/specialistDaemonScheduler.ts packages/infrastructure/src/companyIntelligenceSources.ts
      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src/specialistDaemonScheduler.ts packages/infrastructure/src/companyIntelligenceSources.ts
          git commit -m "chore: apply final strict fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
