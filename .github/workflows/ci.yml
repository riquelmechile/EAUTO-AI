name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-content-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Correct legacy content mode assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/smoke-production-runtime.mjs")
          source = path.read_text()
          old = 'runtime.contentGenerationMode === "deterministic"'
          new = 'runtime.contentGenerationMode === "disabled"'
          if old not in source:
              raise SystemExit("legacy content mode assertion not found")
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write scripts/smoke-production-runtime.mjs
          npm run format:check
          npm run typecheck
      - name: Commit corrected smoke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-production-runtime.mjs
          git commit -m "fix(smoke): require disabled legacy content runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
