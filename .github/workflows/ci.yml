name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone PR branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Use project Node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies quietly
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build runtime quietly
        run: npm run build > /tmp/build.log 2>&1 || { tail -n 20 /tmp/build.log; exit 1; }
      - name: Run PostgreSQL runtime smoke with final failure only
        run: |
          cp .env.production.example .env.production
          set +e
          npm run smoke:production-runtime > /tmp/postgres-smoke.log 2>&1
          status=$?
          tail -n 20 /tmp/postgres-smoke.log
          exit "$status"
