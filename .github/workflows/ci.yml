name: Format Supplier Mirror Slice

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/supplier-mirror-stock-risk-daemon
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format async supplier mirror contract"
          git push origin HEAD:feat/supplier-mirror-stock-risk-daemon
