name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone PR branch quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$HEAD_REF" "https://github.com/$REPOSITORY.git" .
      - name: Install dependencies quietly
        run: npm ci --no-audit --no-fund --loglevel=error >/dev/null
      - name: Build package entries
        run: npm run typecheck >/dev/null
      - name: Show lint diagnostics
        run: |
          set -o pipefail
          npm run lint 2>&1 | tail -n 100
