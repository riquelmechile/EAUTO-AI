name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format final audit files
        run: npx prettier --write config/capability-parity.json config/credential-requirements.json docs/CAPABILITY_PARITY.md scripts/capability-parity-doctor.mjs scripts/credentials-doctor.mjs scripts/generate-internal-secrets.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/capability-parity.json config/credential-requirements.json docs/CAPABILITY_PARITY.md scripts/capability-parity-doctor.mjs scripts/credentials-doctor.mjs scripts/generate-internal-secrets.mjs
          git commit -m "chore: format final readiness audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
