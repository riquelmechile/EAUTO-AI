name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Capture typecheck diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-typecheck
          path: typecheck.log
          if-no-files-found: error
      - name: Enforce typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Start object storage
        run: |
          docker compose -f infra/compose/docker-compose.yml up -d minio
          docker compose -f infra/compose/docker-compose.yml run --rm minio-init
      - name: Verify signed object storage flow
        run: npm run smoke:object-storage
      - name: Stop object storage
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --remove-orphans
      - name: Doctor
        run: npm run doctor
