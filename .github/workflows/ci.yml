name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies quietly
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: List files requiring Prettier
        run: npx prettier --check docs/sdd/007-product-identification-persistence-review.md docs/sdd/008-product-fingerprint-semantics.md infra/postgres/migrations/030_product_fingerprint_semantics.sql packages/content/src/deterministicProductVisionProvider.ts packages/domain/src/productVisualFingerprint.ts packages/infrastructure/src/postgresProductIdentificationRepository.ts scripts/production-check.mjs scripts/smoke-product-identification-postgres.mjs tests/deterministicProductVisionProvider.test.ts tests/productFingerprintSemantics.test.ts
