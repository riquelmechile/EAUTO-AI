name: Export source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/mercadolibre-webhooks-runtime

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package repository
        run: zip -qr eauto-source.zip . -x '.git/*' 'node_modules/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: eauto-source
          path: eauto-source.zip
          retention-days: 1
