name: Format release candidate

on:
  push:
    branches:
      - "release/v0.1.0-readiness"
    paths:
      - ".github/workflows/format-release-candidate.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format candidate files
        run: npx prettier --write README.md scripts/audit-policy.mjs
      - name: Commit formatted files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for path in README.md scripts/audit-policy.mjs; do
            if git diff --quiet -- "$path"; then
              continue
            fi
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha)"
            export CURRENT_SHA="$current_sha" CURRENT_PATH="$path"
            node <<'NODE'
          const fs = require("node:fs");
          const payload = {
            message: `style: format ${process.env.CURRENT_PATH}`,
            content: fs.readFileSync(process.env.CURRENT_PATH).toString("base64"),
            sha: process.env.CURRENT_SHA,
            branch: process.env.GITHUB_REF_NAME,
          };
          fs.writeFileSync("/tmp/file-update.json", JSON.stringify(payload));
          NODE
            gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/contents/$path" \
              --input /tmp/file-update.json \
              --silent
          done
