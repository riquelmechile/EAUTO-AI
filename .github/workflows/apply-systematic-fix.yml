name: Apply systematic production audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/systematic-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Verify and apply audited source
        shell: bash
        run: |
          set -euo pipefail
          cat .systematic-fix/00.bin .systematic-fix/01.bin .systematic-fix/02.bin .systematic-fix/03.bin > /tmp/eauto-systematic-fix.tar.xz
          echo 'f09cce7e65a5736ce976d25b0e9ca46f5ab3c45d7c0d4ec3bacee4711e3dd8cb  /tmp/eauto-systematic-fix.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/eauto-systematic-fix.tar.xz -C .
          rm -rf .systematic-fix .audit-patch .phaseb-patch
          rm -f .github/workflows/audit-current-source.yml
          rm -f .github/workflows/audit-source-export.yml
          rm -f .github/workflows/apply-systematic-fix.yml
          rm -f docs/.keep-audit docs/audit-method.md docs/audit-placeholder.md docs/audit-status.md
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply canonical formatting
        run: npm run format
      - name: Commit clean audit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden tenant isolation and verified action lifecycle'
          git push
