name: Fix governed delegation order

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/systematic-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Apply delegation ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('packages/application/src/governedWorkOrderProcessor.ts')
          text = path.read_text()
          pattern = re.compile(
              r'      const started = await this\.agentOs\.startSession\(\{\n'
              r'.*?'
              r'      \}\);\n'
              r'      if \(!leaf\) \{\n'
              r'.*?'
              r'      \} else \{\n'
              r'        runningLeafSessionId = started\.id;\n'
              r'      \}',
              re.DOTALL,
          )
          replacement = '''      const started = await this.agentOs.startSession({
            organizationId: order.organizationId,
            accountId: order.accountId,
            sessionId: created.session.id,
          });

          if (parentSessionId) {
            await this.agentOs.completeSession({
              organizationId: order.organizationId,
              accountId: order.accountId,
              sessionId: parentSessionId,
              outputRefs: Object.freeze([`delegation:${contract.id}`, `evidence-pack:${pack.id}`]),
              spentMinorClp: 0,
            });
          }

          if (leaf) {
            runningLeafSessionId = started.id;
          } else {
            parentSessionId = started.id;
          }'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy delegation block, found {count}')
          path.write_text(updated)
          PY
          npm ci --no-audit --no-fund
          npx prettier --write packages/application/src/governedWorkOrderProcessor.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application/src/governedWorkOrderProcessor.ts
          git commit -m "fix: keep parent sessions active until delegation"
          git push
