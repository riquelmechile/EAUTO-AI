  <path d="M1050 350C930 422 770 456 606 456C436 456 270 418 148 350" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 9" marker-end="url(#eauto-arrow)"/>
  <text x="600" y="434" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">el outcome verificado alimenta scorecards y memoria consultiva; nunca concede autoridad por sí solo</text>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
    <rect x="72" y="365" width="166" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="155" y="387" text-anchor="middle">fail-closed por defecto</text>
    <rect x="260" y="365" width="160" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="340" y="387" text-anchor="middle">scope por cuenta</text>
    <rect x="442" y="365" width="160" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="522" y="387" text-anchor="middle">idempotencia</text>
    <rect x="624" y="365" width="160" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="704" y="387" text-anchor="middle">presupuesto + riesgo</text>
    <rect x="806" y="365" width="160" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="886" y="387" text-anchor="middle">rollback gobernado</text>
    <rect x="988" y="365" width="140" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <text x="1058" y="387" text-anchor="middle">audit trail</text>
  </g>
